# Document Intelligence Platform Configuration
# Research-Level RAG Pipeline Settings

# ============================================
# DOCUMENT PROCESSING
# ============================================
document:
  input_dir: "storage/docs"
  supported_formats:
    - ".pdf"
    - ".txt"
    - ".docx"
    - ".md"
    - ".html"
    - ".csv"

# ============================================
# KNOWLEDGE STRUCTURING (SEMANTIC CHUNKING)
# ============================================
chunking:
  method: "semantic"  # semantic or fixed
  # Semantic chunking settings
  semantic:
    embedding_model: "nomic-embed-text:latest"
    similarity_threshold: 0.3  # if similarity drops below this, start new chunk
    min_chunk_words: 50
    max_chunk_words: 300
  # Fixed chunking (fallback)
  fixed:
    chunk_size_words: 150
    overlap_words: 40

# ============================================
# EMBEDDINGS
# ============================================
embeddings:
  model_name: "nomic-embed-text:latest"
  normalize: true
  batch_size: 32
  device: "cpu"

# ============================================
# RETRIEVAL
# ============================================
retrieval:
  vector_db: "faiss"
  top_k: 10
  min_score: 0.0
  index_path: "storage/faiss/document_index.faiss"
  metadata_path: "storage/faiss/metadata.pkl"

# ============================================
# RE-RANKING
# ============================================
reranking:
  enabled: false
  model_name: "BAAI/bge-reranker-base"
  top_k: 5
  device: "cpu"

# ============================================
# ANSWER GENERATION
# ============================================
answer:
  hybrid_mode: true
  use_local: true
  local_model: "phi3:mini"
  ollama_url: "http://localhost:11434/api/generate"
  timeout: 300

  grok_api_key: ${GROK_API_KEY}
  grok_model: "grok-beta"
  grok_url: "https://api.x.ai/v1"

  gemini_api_key: ${GEMINI_API_KEY}
  gemini_model: "gemini-1.5-flash"

  use_openai: false
  openai_model: "gpt-4"
  openai_api_key: ${OPENAI_API_KEY}

  use_huggingface: false
  hf_model: "Qwen/Qwen2.5-7B-Instruct"
  hf_token: ${HF_TOKEN}

  strict_mode: true
  extractive: true

# ============================================
# EVIDENCE VERIFICATION
# ============================================
verification:
  enabled: true
  nli_model: "facebook/bart-large-mnli"
  local_model: "phi3:mini"
  ollama_url: "http://localhost:11434/api/generate"
  timeout: 300

# ============================================
# OUTPUT
# ============================================
output:
  format: "structured"
  include_citations: true
  include_timestamps: false # Not relevant for documents

# ============================================
# LOGGING
# ============================================
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "document_qa.log"
