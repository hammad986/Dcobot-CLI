[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcobot"
version = "1.0.0"
description = "RAG-driven CLI tool automating document ingestion, semantic chunking, and ultra-fast similarity search."
readme = "README.md"
authors = [
    { name = "Muhammed Hammad S", email = "mdhammad2906@gmail.com" }
]
license = { text = "MIT" }
keywords = ["rag", "cli", "faiss", "document-intelligence", "llm", "search", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "faiss-cpu>=1.7.4",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "rank-bm25>=0.2.2",
]

[project.urls]
Homepage = "https://github.com/hammad986/Dcobot-CLI"
Repository = "https://github.com/hammad986/Dcobot-CLI"
"Bug Tracker" = "https://github.com/hammad986/Dcobot-CLI/issues"
Author = "https://hammad986.dpdns.org/"

[project.scripts]
dcobot = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
